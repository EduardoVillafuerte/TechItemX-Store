<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <header class="header">
        <h1 class="header__title">TechItemX Store</h1>
    </header>

    <main class="main-content">
        <section class="products">
            <h2 class="products__title">Lista de Productos</h2>
            <div class="products__grid" id="product-list">
                <!-- Los productos se inyectarán aquí vía JavaScript -->
            </div>
        </section>

        <aside class="cart">
            <h2 class="cart__title">Carrito de Compras</h2>
            <div class="cart__items" id="cart-list">
                <p class="cart__empty-msg">Tu carrito está vacío.</p>
                <!-- Los ítems del carrito se inyectarán aquí -->
            </div>
            <div class="cart__summary">
                <span class="cart__total-label">Total:</span>
                <span class="cart__total-price" id="cart-total">$0.00</span>
            </div>
        </aside>
    </main>

    <script src="src/main.js"></script>
</body>
</html>
